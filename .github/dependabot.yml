# Keeps the release workflow actions current (Node runtimes, security fixes)
# so they do not silently age into deprecation. Grouped into one weekly PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      workflow-actions:
        patterns:
          - "*"

  # Production and development dependencies are grouped separately so a
  # security update does not arrive mixed with tooling upgrades.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
