# Keeps the release workflow actions current (Node runtimes, security fixes)
# so they do not silently age into deprecation. Grouped into one weekly PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      workflow-actions:
        patterns:
          - "*"

  # Patch and minor updates are grouped by dependency type. Major updates are
  # deliberately left out of the groups: each one gets its own PR and its own
  # migration slice instead of arriving mixed with safe upgrades.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-patch-minor:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      development-patch-minor:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # astro check does not support TypeScript 7 yet. Revisit when Astro
      # updates its checker (or ships the ts-content-mapper by default).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # The app bundles Node 24; keep the type definitions on the same major.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
