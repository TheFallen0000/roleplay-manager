name: Deploy website

# The Cloudflare Pages project uses direct upload: this workflow builds the
# static site and publishes `packages/website/dist` with Wrangler. It runs on
# website changes and can be dispatched manually or from the release workflow.
on:
  push:
    branches:
      - master
    paths:
      - "packages/website/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @workspace/website build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.152.0 pages deploy packages/website/dist
          --project-name=roleplay-manager
          --branch=master
          --commit-dirty=true
