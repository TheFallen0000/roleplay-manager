name: Release

# Publishes the portable packages (Windows, Linux and macOS) as a GitHub Release.
#
# Automatic: a push to `master` that changes `package.json` (i.e. a version
# bump) publishes the release for that version, as long as it does not exist
# yet. Pushes that do not change the version are ignored.
# Manual: push a tag `v*` (it must match `package.json`) to publish that version.
# workflow_dispatch: builds and validates without publishing (dry run) unless
# the `publish` input is enabled.
#
# Native modules (better-sqlite3, sharp) are installed on the target OS, so each
# package is built and smoke-tested on its own runner.

on:
  push:
    branches:
      - master
    paths:
      - "package.json"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (leave it off for a dry run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Decide what to do
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to build and publish
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual run for ${tag} (publish=${{ inputs.publish }})."
            exit 0
          fi

          # A tag push must match the version in package.json.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json (${version})."
            exit 1
          fi

          # Nothing to do when that version already has a release.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::Release ${tag} already exists; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing ${tag}."

  gates:
    name: Quality gates
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same version that gets bundled in the packages.
          node-version: "24.18.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: pnpm check

      - name: Backend tests
        run: pnpm --filter @workspace/backend test

      - name: Frontend tests
        run: pnpm --filter @workspace/frontend exec vitest run

  build:
    name: Package ${{ matrix.target }}
    needs: [prepare, gates]
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: mac-arm64
          - os: macos-26-intel
            target: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm package:app

      - name: Smoke test the artifact
        run: node scripts/smoke-package.mjs

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Download every package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Build the release notes
        run: node scripts/release-notes.mjs "${{ needs.prepare.outputs.version }}" > release-notes.md

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          ls -l release
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            # The tag already exists (tag push): publish against it.
            gh release create "${tag}" release/* \
              --title "${tag}" \
              --notes-file release-notes.md
          else
            # Create the tag at the commit that was pushed.
            gh release create "${tag}" release/* \
              --title "${tag}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}"
          fi
