name: Release

# Publishes the portable Windows x64 package as a GitHub Release.
# Push a version tag (matching package.json) to publish; run it manually
# (workflow_dispatch) for a dry run that builds and validates without publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same version that gets bundled in the package.
          node-version: "24.18.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json (${version})"
            exit 1
          fi

      - name: Quality gates
        run: pnpm check

      - name: Backend tests
        run: pnpm --filter @workspace/backend test

      - name: Frontend tests
        run: pnpm --filter @workspace/frontend exec vitest run

      - name: Package (Windows x64)
        run: pnpm package:win

      - name: Smoke test the artifact
        run: node scripts/smoke-package.mjs

      - name: Build the release notes
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$version" > release-notes.md

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v${version}" release/*.zip \
            --title "v${version}" \
            --notes-file release-notes.md
